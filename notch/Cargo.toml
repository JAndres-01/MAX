[package]
name = "max-notch"
version = "0.1.0"
edition = "2021"
authors = ["Hyprland Community"]
description = "Native living notch for MAX with Nusa-style aesthetics"

[[bin]]
name = "max-notch"
path = "src/main.rs"

[dependencies]
max-core = { path = "../core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5.0"
uuid = { version = "1.8", features = ["v4"] }
