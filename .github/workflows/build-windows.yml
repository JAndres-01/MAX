name: Build MAX Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Package MAX (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: 1. Build Rust Core (max_core.dll)
        run: |
          cd core
          cargo build --release --lib
        shell: bash

      - name: 2. Build Flutter Windows Desktop (Release)
        run: |
          cd ui
          flutter pub get
          flutter build windows --release
        shell: bash

      - name: 3. Assemble Release Directory
        run: |
          $BundleDir = "ui/build/windows/x64/runner/Release"
          Copy-Item -Force "core/target/release/max_core.dll" "$BundleDir/max_core.dll"
          Write-Host "Bundle assembled with max_core.dll successfully."
        shell: pwsh

      - name: 4. Install Inno Setup
        run: choco install innosetup --no-progress
        shell: cmd

      - name: 5. Compile Inno Setup Installer (.exe)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/max_setup.iss
        shell: pwsh

      - name: 6. Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAX-Setup-Windows-x64
          path: installer/output/MAX-Setup-x64.exe
          if-no-files-found: error

      - name: 7. Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/MAX-Setup-x64.exe
          generate_release_notes: true
